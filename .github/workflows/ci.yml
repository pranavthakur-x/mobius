name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      matrix:
        # Match go.mod (go 1.25.0); GOTOOLCHAIN=local cannot satisfy 1.24 on that directive.
        go-version: [ '1.25' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly. Run 'make fmt'."
            gofmt -d .
            exit 1
          fi

      - name: Verify Go Modules
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is out of date. Run 'make tidy' and commit."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build All Packages
        run: go build ./...

      - name: Build Binary
        run: go build -v -o bin/mobius ./cmd/mobius
